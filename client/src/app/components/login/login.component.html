<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-container">
    <!-- Card Container -->
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
      
      <!-- Top Brand Header Banner -->
      <div class="login-header text-center p-4 pb-3">
        <div class="brand-logo-wrap mb-2">
          <img src="logo.png" alt="Sathlokhar Solar" class="brand-logo-img">
        </div>
        <h4 class="fw-bold text-dark mb-1 tracking-tight">Solar Workspace Login</h4>
        <p class="text-muted small mb-0">Sign in with your employee credentials to continue</p>
      </div>

      <div class="card-body p-4 pt-2">
        <!-- Error Alert Message -->
        <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 py-2.5 px-3 mb-3 border-0 rounded-3 shadow-xs" role="alert">
          <i class="bi bi-exclamation-triangle-fill fs-6 text-danger"></i>
          <div class="small fw-medium">{{ errorMessage }}</div>
        </div>

        <form (ngSubmit)="onSubmit()" class="login-form">
          <!-- Username / Email Input -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-dark mb-1">Username or Email ID</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-person-circle"></i>
              </span>
              <input type="text" 
                     class="form-control border-start-0 ps-0 bg-light" 
                     placeholder="Username" 
                     [(ngModel)]="credentials.username" 
                     name="username" 
                     required 
                     autocomplete="username">
            </div>
          </div>

          <!-- Password Input with Show/Hide Eye Toggle -->
          <div class="mb-4">
            <label class="form-label small fw-bold text-dark mb-1">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-lock-fill"></i>
              </span>
              <input [type]="showPassword ? 'text' : 'password'" 
                     class="form-control border-start-0 border-end-0 ps-0 bg-light font-mono" 
                     placeholder="Password" 
                     [(ngModel)]="credentials.password" 
                     name="password" 
                     required 
                     autocomplete="current-password">
              <button class="btn btn-outline-secondary border-start-0 bg-light text-muted shadow-none" 
                      type="button" 
                      (click)="togglePasswordVisibility()" 
                      title="Toggle password view">
                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" 
                  class="btn btn-primary w-100 py-2.5 fw-bold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2 login-btn"
                  [disabled]="loading">
            <div *ngIf="loading" class="spinner-border spinner-border-sm text-white" role="status"></div>
            <span>{{ loading ? 'Signing In...' : 'Sign In' }}</span>
            <i *ngIf="!loading" class="bi bi-arrow-right"></i>
          </button>
        </form>
      </div>

      <!-- Footer Note -->
      <div class="card-footer bg-light border-0 py-2.5 text-center">
        <small class="text-muted" style="font-size: 0.72rem;">
          &copy; Sathlokhar Synergys E&amp;C Global Limited &bull; Solar EPC Workspace
        </small>
      </div>

    </div>
  </div>
</div>
